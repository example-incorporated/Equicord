name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.ETOKEN }}
    REPO: Equicord/Equibored
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Equicord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7.1.0
              with:
                    # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
                    package-manager-cache: true # optional, default is true
                    # Used to specify the path to a dependency file: package-lock.json, yarn.lock, etc. Supports wildcards or a list of file names for caching multiple dependencies.
            - name: Install dependencies
              run: npm i -g yarn && yarn install

            - name: Build web
              run: yarn run buildWebStandalone

            - name: Build
              run: yarn run buildStandalone

            - name: Generate plugin lists
              run: |
                  yarn run generatePluginJson dist/plugins.json
                  yarn run generateEquicordPluginJson dist/equicordplugins.json
                  yarn run generateVencordPluginJson dist/vencordplugins.json
                  yarn run generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Upload Equicord Stable
              if: ${{ vars.ACT == 'false' }}
              run: |
                  gh release upload latest --clobber dist/release/*

            - name: Upload Plugin JSONs to Equibored repo
              if: github.repository == 'Equicord/Equicord' && vars.ACT == 'false'
              run: |
                  git config --global user.name "GitHub-Actions"
                  git config --global user.email actions@github.com
                  git clone https://$USERNAME:$GITHUB_TOKEN@github.com/$REPO.git plugins
                  cd plugins

                  cp ../dist/release/*plugins.json .
                  cp ../dist/release/devs.json .
                  git add -A

                  git commit -m "Plugins for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  git push --force https://$USERNAME:$GITHUB_TOKEN@github.com/$REPO.git
